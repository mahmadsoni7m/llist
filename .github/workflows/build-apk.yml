name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download handwriting fonts (OFL)
        run: |
          D=app/src/main/assets/fonts
          B=https://github.com/google/fonts/raw/main/ofl
          get() { curl -fsSL --retry 3 -o "$D/$1" "$B/$2" && echo "OK $1 $(stat -c%s "$D/$1") bytes" || echo "::warning::Шрифт $1 зеркашӣ нашуд ($2)"; }
          get natural.ttf "caveat/Caveat%5Bwght%5D.ttf"
          get beautiful.ttf "marckscript/MarckScript-Regular.ttf"
          get clean.ttf "badscript/BadScript-Regular.ttf"
          ls -la "$D"

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintDebug

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename Debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk LIST-OFFICE-ULTRA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LIST-OFFICE-ULTRA-APK
          path: LIST-OFFICE-ULTRA.apk

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk LIST-OFFICE-ULTRA-release.apk

      - name: Upload Release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: LIST-OFFICE-ULTRA-RELEASE-APK
          path: LIST-OFFICE-ULTRA-release.apk

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
